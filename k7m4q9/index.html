<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Private report</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #235e91;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #235e91;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #edf3f8;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    <style>/* The password screen follows the report's light/dark presentation. */
.staticrypt-body {
    color-scheme: light;
    --report-background: #ffffff;
    --report-text: #171717;
    --report-muted: #525252;
    --report-border: #d4d4d4;
    --report-field: #f5f5f5;
    --report-accent: #2563eb;
}

@media (prefers-color-scheme: dark) {
    .staticrypt-body {
        color-scheme: dark;
        --report-background: #18181b;
        --report-text: #fafafa;
        --report-muted: #a1a1aa;
        --report-border: #52525b;
        --report-field: #27272a;
        --report-accent: #93c5fd;
    }
}

.staticrypt-body[data-vscode-theme-kind="vscode-dark"],
.staticrypt-body[data-vscode-theme-kind="vscode-high-contrast"] {
    color-scheme: dark;
    --report-background: #18181b;
    --report-text: #fafafa;
    --report-muted: #a1a1aa;
    --report-border: #52525b;
    --report-field: #27272a;
    --report-accent: #93c5fd;
}

.staticrypt-body[data-vscode-theme-kind="vscode-light"] {
    color-scheme: light;
    --report-background: #ffffff;
    --report-text: #171717;
    --report-muted: #525252;
    --report-border: #d4d4d4;
    --report-field: #f5f5f5;
    --report-accent: #2563eb;
}

.staticrypt-body,
.staticrypt-content {
    background: var(--report-background);
    color: var(--report-text);
    font-family: system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
}

.staticrypt-content {
    box-sizing: border-box;
    padding: 48px 24px;
}

.staticrypt-page {
    width: min(100%, 1080px);
    padding: 0;
}

.staticrypt-form {
    background: transparent;
    max-width: 640px;
    margin: 0;
    padding: 0;
    text-align: left;
    box-shadow: none;
}

.staticrypt-title {
    font-family: Georgia, serif;
    font-size: 2rem;
    line-height: 1.3;
    margin: 0 0 24px;
}

.staticrypt-instructions {
    margin: 0 0 24px;
}

.staticrypt-instructions p:not(.staticrypt-title) {
    color: var(--report-muted);
}

.staticrypt-hr {
    border-color: var(--report-border);
    margin: 24px 0;
}

.staticrypt-password-container {
    background: var(--report-field);
    border: 1px solid var(--report-border);
    border-radius: 6px;
}

.staticrypt-form input[type="password"],
.staticrypt-form input[type="text"] {
    color: var(--report-text);
    font-family: inherit;
    padding-right: 56px;
}

.staticrypt-form input::placeholder {
    color: var(--report-muted);
    opacity: 1;
}

.staticrypt-password-container:focus-within {
    outline: 2px solid var(--report-accent);
    outline-offset: 2px;
}

.staticrypt-toggle-password-visibility {
    background: #f5f5f5;
    border-radius: 4px;
    box-sizing: content-box;
    padding: 8px;
    right: 7px;
    opacity: 0.8;
}

.staticrypt-form .staticrypt-decrypt-button {
    background: #2563eb;
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    text-transform: none;
}

.staticrypt-form .staticrypt-decrypt-button:hover,
.staticrypt-form .staticrypt-decrypt-button:active,
.staticrypt-form .staticrypt-decrypt-button:focus {
    background: #1d4ed8;
}
</style>
</head>
